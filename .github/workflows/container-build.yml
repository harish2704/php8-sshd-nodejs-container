name: Build and Push Multi-Arch Docker Image

on:
  push:
    branches:
      - main  # Runs on push to main branch
  pull_request:
    branches:
      - main  # Runs on PR to main branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write  # Needed to push to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for Multi-Arch Builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Multi-Arch Image
        uses: docker/build-push-action@v5
        with:
          context: ./build
          platforms: linux/amd64,linux/arm64
          # Avoids the extra "unknown/unknown" entries in the registry's OS/Arch listing.
          # BuildKit otherwise attaches automatically generated "provenance" attestation
          # manifests (build metadata / SBOM refs) which get listed as their own
          # "unknown/unknown" platform alongside linux/amd64 and linux/arm64.
          # Disabling provenance does not change the actual image contents.
          provenance: false
          push: true
          tags: |
            ghcr.io/harish2704/php8-sshd-nodejs-container:latest
            ghcr.io/harish2704/php8-sshd-nodejs-container:${{ github.sha }}
